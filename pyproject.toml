[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "el-agent"
version = "0.1.0"
description = "EL - Your Personal AI Agent. Built on Claude Code."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=21.0",
    "openai-whisper>=20231117",
    "numpy>=1.24",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
bark = [
    "bark>=0.1.5",
]
piper = [
    "piper-tts>=1.2.0",
]
all = [
    "bark>=0.1.5",
    "piper-tts>=1.2.0",
]

[project.scripts]
el = "el.cli:main"

[tool.setuptools.packages.find]
include = ["el*"]
